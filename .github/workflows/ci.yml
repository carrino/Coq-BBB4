# The full build cannot run here (docs/VERIFYING.md "Traps"): a hosted
# runner has ~7 GB of RAM and the nine IRules_Batch_* files peak at
# ~6-8 GB each, and the census walk needs coq-native and ~24 h.  Those
# tiers are local (`make`, `make proof`, `make census-verify`).
#
# What CI *can* certify, and does: the core library and the closeout
# kit compile from source, two families of end-to-end machine proofs
# kernel-check, there are zero Admitted anywhere in theories/, and the
# untrusted consistency audits (closeout partition, census cache hash,
# proof-report cross-checks) all pass.
name: CI
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # apt talks to the runner's package mirror, which sometimes hangs
      # mid-fetch (observed 2026-08-19: 43 minutes of silence after an
      # InRelease line, eating the whole job timeout as "cancelled").
      # Bound each attempt and retry, so a bad mirror costs minutes,
      # not the run.
      - name: Install Coq
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo timeout 300 apt-get update && \
            sudo timeout 300 apt-get install -y coq && exit 0
            echo "apt attempt $i failed or hung; retrying"
            sleep 10
          done
          exit 1
      - name: Coq version (expect 8.18.0)
        run: coqc --version
      - name: Generate Makefile.coq
        run: make Makefile.coq
      - name: "Build graph closes: every target of `make all` has a rule (dry run)"
        run: make -f Makefile.coq -n all > /dev/null
      - name: Core library + closeout kit, from source
        run: make -f Makefile.coq -j4 theories/Closeout/CloseoutKit.vo
      - name: End-to-end machine proofs (cycler + translated-cycler checkers)
        run: |
          make -f Makefile.coq -j4 theories/Machines/Cycle_Examples.vo
          make -f Makefile.coq -j4 theories/Machines/TCycler_Examples.vo
      - name: "Hygiene: zero Admitted in theories/"
        run: "! grep -rn 'Admitted\\.' theories --include='*.v'"
      - name: "Hygiene: every .v under theories/ is built or explicitly exempt"
        run: python3 tools/check_coqproject.py
      - name: "Untrusted audits: closeout partition, census cache, report"
        run: |
          python3 tools/closeout/audit.py
          python3 tools/census_cache.py --check
          python3 tools/proof_report.py > /dev/null
