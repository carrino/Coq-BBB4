name: Recent four-symbol state proofs
on:
  pull_request:
    paths: ['four/**', '.github/actions/setup-native-coq/**', '.github/workflows/state-cases-recent.yml']
  push:
    branches: [main]
    paths: ['four/**', '.github/actions/setup-native-coq/**', '.github/workflows/state-cases-recent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: state-cases-recent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    defaults:
      run:
        shell: opam exec -- bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native-coq
      - name: Build and audit every recent case in this group
        run: python3 four/tools/replay_state_case_proofs.py --checkpoint recent --group "${{ matrix.group }}"
      - name: Preserve proof replay and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-state-case-proofs-${{ matrix.group }}
          path: |
            four/build/state-case-proof-replay/recent/
            four/build/s036-source-replay/
            four/build/**/proof/*.log
            four/build/**/proof/*receipt*.json
            four/build/**/proof/kernel-audit*.json
          retention-days: 14
