name: Four-state waiting lower bounds

on:
  push:
    branches: [main]
    paths:
      - 'wait42/**'
      - 'theories/**'
      - '_CoqProject'
      - '.github/actions/setup-native-coq/**'
      - '.github/workflows/wait42.yml'
  pull_request:
    paths:
      - 'wait42/**'
      - 'theories/**'
      - '_CoqProject'
      - '.github/actions/setup-native-coq/**'
      - '.github/workflows/wait42.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbb-wait42-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lower-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native-coq
      - name: Check search tools
        run: make -C wait42 test
      - name: Prove and recursively audit foundations and lower bounds
        run: opam exec -- make -C wait42 proof -j2
      - name: Replay periodic and n-gram certificate samples
        run: opam exec -- make -C wait42 proof-replay -j2
      - name: Prove quantitative sweep and counter bounds
        run: opam exec -- make -C wait42 proof-timing -j2
      - name: Replay and recursively audit an observation batch
        run: opam exec -- make -C wait42 proof-observations BUILD_JOBS=1 OBSERVATION_MAX_BATCHES=1 OBSERVATION_STATE=build/observation-ci
      - name: Verify observation receipts without scheduling more work
        run: opam exec -- make -C wait42 proof-observations BUILD_JOBS=2 OBSERVATION_MAX_BATCHES=0 OBSERVATION_STATE=build/observation-ci
      - name: Replay and recursively audit an instruction observation batch
        run: opam exec -- make -C wait42 proof-instruction-observations BUILD_JOBS=1 OBSERVATION_MAX_BATCHES=1 INSTRUCTION_OBSERVATION_STATE=build/instruction-observation-ci
      - name: Verify instruction receipts without scheduling more work
        run: opam exec -- make -C wait42 proof-instruction-observations BUILD_JOBS=2 OBSERVATION_MAX_BATCHES=0 INSTRUCTION_OBSERVATION_STATE=build/instruction-observation-ci
